[package]
name = "runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
autobins = false

[features]
desktop-e2e = []
production = []

[lib]
name = "runtime"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
bytes = "1"
log = "0.4"
rand = "0.8"
rmp-serde = "1.3"
reqwest = { version = "0.12.22", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync", "time", "net", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.1", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
